<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#050505">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="CampusPoint">
    <link rel="apple-touch-icon" href="https://ik.imagekit.io/rstofficial/CAMPUS.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Campus Point</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- Cropper & Fabric -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>

    <!-- Google Maps API (Replace YOUR_GOOGLE_MAPS_API_KEY) -->
    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&callback=initMap" async defer></script>
    
    <style>
        :root {
            /* --- APPLE VISION / GLASS VARIABLES --- */
            --bg-main: #000000;
            --bg-glass: rgba(30, 30, 35, 0.85);
            --bg-card: rgba(40, 40, 45, 0.90);
            --bg-card2: rgba(40, 40, 45, 0.933);
            --bg-input: rgba(255, 255, 255, 0.12);
            --border: rgba(255, 255, 255, 0.15);
            --border-light: rgba(255, 255, 255, 0.25);
            --text-primary: #FFFFFF;
            --text-secondary: rgba(235, 235, 245, 0.6);
            --accent: #0A84FF;
            --accent-glow: rgba(10, 132, 255, 0.5);
            --boost-color: #FFD60A;
            --header-h: 60px;
            --nav-h: 80px;
            --radius-l: 16px;
            --radius-m: 16px;
        }

        [data-theme="light"] {
            --bg-main: #F2F4F8;
            --bg-glass: rgba(255, 255, 255, 0.849);
            --bg-card: #fffffff8;
            --bg-input: #eaecef34;
            --border: #DDE1E6;
            --text-primary: #111111;
            --text-secondary: #555555;
            --accent: #304FFE;
            --accent-glow: rgba(48, 79, 254, 0.2);
            --boost-color: #F9A825;
            --header-h: 60px;
            --nav-h: 80px;
            --radius-l: 16px;
            --radius-m: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            overflow-y: auto;
            min-height: 100vh;
            -webkit-user-select: none;
            user-select: none;
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(10, 132, 255, 0.15), transparent 40%),
                radial-gradient(circle at 100% 0%, rgba(191, 90, 242, 0.15), transparent 40%),
                radial-gradient(circle at 50% 100%, rgba(50, 215, 75, 0.1), transparent 50%);
            background-attachment: fixed;
        }

        input, textarea, select {
            -webkit-user-select: text;
            user-select: text;
        }

        .app-container {
            width: 100%; max-width: 480px; margin: 0 auto;
            min-height: 100vh; position: relative; padding-bottom: 80px;
        }

        .header {
            height: var(--header-h); padding: 0 20px;
            background: var(--bg-glass); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            position: fixed; top: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 480px; z-index: 1000;
        }

        .content-area {
            padding-top: calc(var(--header-h) + 20px);
            padding-left: 20px; padding-right: 20px;
        }
        .hidden { display: none !important; }

        .nexus-input {
            width: 100%; background: var(--bg-input); border: 1px solid var(--border);
            padding: 14px; border-radius: var(--radius-m); color: var(--text-primary);
            font-family: 'Inter', sans-serif; margin-bottom: 15px; outline: none;
            transition: border-color 0.3s;
        }
        .nexus-input:focus { border-color: var(--accent); }
        
        label { display: block; font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 6px; font-family: 'JetBrains Mono', monospace; }

        .auth-btn, .action-btn {
            background: var(--accent); color: #FFFFFF; border: none; padding: 14px 25px;
            border-radius: 50px; font-weight: 600; cursor: pointer; width: 100%;
            box-shadow: 0 4px 15px var(--accent-glow); margin-top: 10px;
        }
        .action-btn:disabled { opacity: 0.7; cursor: not-allowed; }

        .hero-illustration { width: 100%; height: auto; margin-bottom: 10px; animation: floatHero 4s ease-in-out infinite; }
        @keyframes floatHero { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

        #auth-overlay { background-color: #000000 !important; padding: 40px 25px; display: flex !important; flex-direction: column; justify-content: space-between; align-items: center; z-index: 9999; }
        #auth-overlay.hidden { display: none !important; }
        .auth-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; max-width: 360px; }
        .auth-headline { font-size: 2rem; font-weight: 600; color: #ffffff; text-align: center; line-height: 1.2; margin-bottom: 10px; letter-spacing: -0.5px; }
        .auth-subhead { font-size: 1rem; color: var(--text-secondary); margin-bottom: 40px; text-align: center; }
        .pinterest-google-btn { width: 100%; background-color: transparent; border: 1px solid #3f3f3f; border-radius: 50px; padding: 14px 20px; color: #ffffff; font-size: 1rem; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 12px; cursor: pointer; transition: all 0.2s; font-family: inherit; margin-bottom: 20px; }
        .pinterest-google-btn:active { background-color: #1a1a1a; transform: scale(0.98); border-color: #666; }
        .auth-footer { width: 100%; max-width: 300px; text-align: center; font-size: 0.75rem; color: #777; line-height: 1.5; padding-bottom: 10px; }
        .auth-footer a { color: #fff; text-decoration: none; font-weight: 500; }
        
        .secondary-btn { background: transparent; color: var(--text-primary); border: 1px solid var(--border); padding: 8px 20px; border-radius: 50px; font-size: 0.85rem; cursor: pointer; margin-top: 10px; }
        .secondary-btn2 { background: transparent; color: var(--text-primary); border: 1px solid var(--border); padding: 14px 25px; border-radius: 50px; font-weight: 600; cursor: pointer; width: 100%; box-shadow: 0 4px 15px var(--accent-glow); margin-top: 10px; }

        .post-card, .chat-item { background: var(--bg-card); backdrop-filter: blur(25px) saturate(180%); -webkit-backdrop-filter: blur(25px) saturate(180%); border: 1px solid var(--border); border-radius: var(--radius-l); padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 24px -1px rgba(0, 0, 0, 0.2); }
        .feed-post-img { width: 100%; display: block; margin-top: 0px; border-radius: 8px; border: 1px solid var(--border); object-fit: cover; height: auto; max-height: 550px; min-height: 225px; }
        .chat-item { display: flex; align-items: center; cursor: pointer; }
        .chat-item:hover { border-color: var(--accent); }
        .post-actions { display: flex; gap: 20px; margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--border); }
        .action-item { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 0.9rem; color: var(--text-secondary); transition: 0.2s; }
        .action-item.boosted { color: var(--boost-color); }
        .action-item:hover { color: var(--text-primary); }
        .discussion-area { margin-top: 15px; background: var(--bg-input); border-radius: 8px; padding: 10px; display: none; }
        .discussion-area.show { display: block; }
        .comment-item { font-size: 0.85rem; padding: 8px 0; border-bottom: 1px solid var(--border); }
        .comment-item:last-child { border-bottom: none; }

        .bottom-nav { height: 65px; background: var(--bg-glass); backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%); border: 1px solid var(--border-light); display: flex; justify-content: space-around; align-items: center; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; z-index: 1000; border-radius: 50px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .nav-item { font-size: 1.4rem; color: var(--text-secondary); cursor: pointer; padding: 10px; transition: color 0.2s; }
        .nav-item.active { color: var(--accent); filter: drop-shadow(0 0 8px var(--accent-glow)); }
        
        .floating-fab { position: fixed; bottom: 100px; right: 20px; width: 56px; height: 56px; background: var(--accent); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; box-shadow: 0 4px 20px var(--accent-glow); z-index: 1100; cursor: pointer; transition: transform 0.2s; border: 1px solid rgba(255,255,255,0.2); }
        .floating-fab:active { transform: scale(0.9); }

        .user-list-item { display: flex; align-items: center; background: var(--bg-card); border: 1px solid var(--border); padding: 12px; margin-bottom: 10px; border-radius: 10px; cursor: pointer; }
        .stats-row { display: flex; justify-content: center; gap: 30px; margin-bottom: 20px; background: var(--bg-card); padding: 15px; border-radius: 12px; border: 1px solid var(--border); }
        .stat-box { text-align: center; }

        .h-flex { display: flex; align-items: center; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .avatar { width: 40px; height: 40px; border-radius: 10px; background-size: cover; margin-right: 12px; border: 1px solid var(--border); flex-shrink: 0; }
        .goal-tag { font-size: 0.7rem; padding: 4px 8px; background: var(--accent-glow); color: var(--accent); border-radius: 6px; border: 1px solid var(--accent); margin-left: auto; }
        
        .bio-text { font-size: 0.9rem; line-height: 1.5; color: var(--text-secondary); margin: 10px auto; max-width: 300px; font-style: italic; }
        .future-goal-display { font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: var(--accent); margin-bottom: 15px; padding: 8px; border: 1px dashed var(--accent); border-radius: 8px; display: inline-block; }
        .interests-container { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; justify-content: center; }
        .interest-chip { padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; border: 1px solid var(--border); color: var(--text-secondary); cursor: pointer; transition: all 0.2s; background: var(--bg-card); }
        .interest-chip.selected { background: var(--accent); color: white; border-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); transform: scale(1.05); }
        .interest-chip.display-only { cursor: default; pointer-events: none; }

        /* --- EXPLORE UI STYLES --- */
        .explore-bottom-sheet {
            flex: 1;
            background: var(--bg-card);
            border-radius: 24px 24px 0 0;
            padding: 25px 20px;
            margin-top: -20px;
            position: relative;
            z-index: 10;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.3);
            overflow-y: auto;
        }

        .explore-user-card {
            display: flex;
            align-items: center;
            padding: 15px;
            background: var(--bg-glass);
            border: 1px solid var(--border);
            border-radius: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .explore-user-card:hover {
            border-color: var(--accent);
        }

        .explore-user-card .avatar {
            width: 55px;
            height: 55px;
            border-radius: 12px;
        }

        .map-custom-marker {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid var(--accent);
            background-size: cover;
            background-position: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            cursor: pointer;
        }

        .loader-spinner { width: 30px; height: 30px; border: 3px solid rgba(255, 255, 255, 0.2); border-radius: 50%; border-top-color: var(--accent); animation: spin 0.8s linear infinite; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        select.nexus-input {
            appearance: none; -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat; background-position: right 1rem center; background-size: 1em;
        }

        .autocomplete-list { position: absolute; top: 100%; left: 0; right: 0; background: var(--bg-card); border: 1px solid var(--border); border-radius: 0 0 8px 8px; max-height: 200px; overflow-y: auto; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.5); display: none; }
        .autocomplete-list.show { display: block; }
        .autocomplete-item { padding: 12px 15px; cursor: pointer; border-bottom: 1px solid var(--border); font-size: 0.9rem; color: var(--text-primary); transition: background 0.2s; }
        .autocomplete-item:last-child { border-bottom: none; }
        .autocomplete-item:hover { background: var(--bg-input); color: var(--accent); }
        .autocomplete-item strong { color: var(--accent); }
    </style>
</head>
<body>

    <!-- AUTH OVERLAY -->
    <div id="auth-overlay">
        <div class="auth-content">
            <img src="https://ik.imagekit.io/rstofficial/heroimagecampuspoint.gif" class="hero-illustration" style="width:100%; margin-bottom:15px;" alt="Logo">
            <h1 class="auth-headline">Connect.<br>Collaborate.<br>Thrive.</h1>
            <p class="auth-subhead">Your professional network starts here.</p>
            <div id="auth-loader" class="loader-spinner"></div>
            <button id="google-btn" class="pinterest-google-btn hidden" onclick="googleLogin()">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c1/Google_%22G%22_logo.svg/1024px-Google_%22G%22_logo.svg.png" style="width:20px; height:20px;">
                Continue with Google
            </button>
            <p id="auth-error" style="color: #ff5555; font-size: 0.8rem; height: 20px;"></p>
        </div>
        <div class="auth-footer">
            By continuing, you agree to Campus Point's <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
        </div>
    </div>

    <div class="app-container">
        
        <header class="header">
            <div class="brand mono" style="font-weight:700; cursor:pointer;" onclick="loadFeed(false)">CAMPUS<span style="color:var(--accent)">POINT</span></div>
            <div class="h-flex">
                <div class="header-icon-btn" onclick="openNotifications()">
                    <i class="fa-regular fa-bell" style="font-size: 1.2rem;"></i>
                    <div id="notif-badge" class="notif-badge" style="display:none; position:absolute; top:0; right:-2px; width:9px; height:9px; background:#ff5555; border-radius:50%;"></div>
                </div>
                <img id="header-avatar" src="" style="width:28px; height:28px; border-radius:6px; display:none;">
            </div>
        </header>

        <div class="floating-fab" onclick="switchTab('create', null)">
            <i class="fa-solid fa-pen"></i>
        </div>

        <!-- SETUP PROFILE SECTION -->
        <main id="section-setup" class="content-area hidden" style="padding-top: 0;">
            <div class="profile-header-wrapper" style="margin-bottom: 50px;">
                <img id="setup-banner-preview" src="" class="banner-img" style="width:100%; height:150px; object-fit:cover; background:var(--bg-card);">
                <div class="edit-pic-wrapper profile-pic-overlap" onclick="document.getElementById('setup-file-input').click()" style="position:absolute; bottom:-50px; left:50%; transform:translateX(-50%); width:110px; height:110px; border-radius:50%; border:4px solid var(--bg-main); background:var(--bg-main); z-index:2; cursor:pointer;">
                    <img id="setup-pic-preview" src="" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">
                </div>
            </div>

            <div style="padding: 0 20px 80px 20px;"> 
                <h2 class="mono" style="text-align:center; margin-bottom: 20px;">EDIT PROFILE</h2>
                <input type="file" id="setup-file-input" accept="image/*" style="display:none;" onchange="previewProfilePic()">

                <label>FULL NAME</label>
                <input type="text" id="setup-name" class="nexus-input">
                
                <label>MAIN NICHE / PROFESSION (e.g., Video Editor)</label>
                <input type="text" id="setup-niche" class="nexus-input" placeholder="What are you best at?">

                <label>LOCATION</label>
                <div class="h-flex" style="gap: 10px;">
                    <input type="text" id="setup-country" class="nexus-input" placeholder="Country/Region">
                    <input type="text" id="setup-city" class="nexus-input" placeholder="City/Postal Code">
                </div>

                <label>EMPLOYMENT STATUS</label>
                <select id="setup-emp-status" class="nexus-input" onchange="toggleEmpFields()">
                    <option value="student" selected>Student</option>
                    <option value="professional">Not a Student</option>
                </select>

                <!-- Student Fields -->
                <div id="fields-student">
                    <label>SCHOOL / UNIVERSITY</label>
                    <div class="input-group">
                        <input type="text" id="setup-university" class="nexus-input" placeholder="Search or type your college..." autocomplete="off">
                        <div id="uni-suggestions" class="autocomplete-list"></div>
                    </div>
                    <label>MAJOR / COURSE</label>
                    <div class="input-group">
                        <input type="text" id="setup-major" class="nexus-input" placeholder="e.g. Physics, B.Tech..." autocomplete="off">
                        <div id="major-suggestions" class="autocomplete-list"></div>
                    </div>
                </div>

                <!-- Professional Fields -->
                <div id="fields-professional" style="display: none;">
                    <label>MOST RECENT JOB TITLE</label>
                    <input type="text" id="setup-job-title" class="nexus-input">
                    <label>EMPLOYMENT TYPE</label>
                    <select id="setup-job-type" class="nexus-input">
                        <option value="Full-time">Full-time</option>
                        <option value="Part-time">Part-time</option>
                        <option value="Freelance">Freelance</option>
                    </select>
                    <label>MOST RECENT COMPANY</label>
                    <input type="text" id="setup-company" class="nexus-input">
                </div>

                <label>JOB SEARCH INTENT</label>
                <select id="setup-job-intent" class="nexus-input" onchange="toggleIntentFields()">
                    <option value="no">No, not interested.</option>
                    <option value="open">Not actively looking, but open to offers.</option>
                    <option value="yes">Yes, actively looking.</option>
                </select>

                <div id="fields-job-prefs" style="display: none;">
                    <label>PREFERRED JOB TITLES</label>
                    <input type="text" id="setup-pref-titles" class="nexus-input" placeholder="e.g., Junior Editor, Motion Graphics">
                    <label>PREFERRED LOCATIONS</label>
                    <input type="text" id="setup-pref-locations" class="nexus-input" placeholder="e.g., Remote, Nagpur">
                </div>

                <label>BIO <span id="bio-count" style="float:right; font-size:0.7rem;">0/150</span></label>
                <textarea id="setup-bio" class="nexus-input" rows="3" maxlength="150" oninput="updateBioCount()"></textarea>

                <button id="btn-save-profile" class="action-btn" onclick="completeSetup()">SAVE PROFILE</button>
                <button class="secondary-btn" onclick="cancelSetup()" style="width:100%;">Cancel</button>
            </div>
        </main>

        <!-- FEED SECTION -->
        <main id="section-feed" class="content-area hidden">
            <div id="feed-container"></div>
        </main>

        <!-- EXPLORE SECTION (Map + List) -->
        <main id="section-explore" class="content-area hidden" style="padding: 0; display: flex; flex-direction: column; height: 100vh;">
            <div id="explore-map" style="flex: 1; min-height: 45vh; background: #e0e0e0;"></div>

            <div class="explore-bottom-sheet">
                <div class="h-flex" style="justify-content: space-between; margin-bottom: 15px;">
                    <h3 style="font-weight: 700;">Nearby Professionals</h3>
                    <span style="color: var(--accent); font-size: 0.85rem; font-weight: 600; cursor: pointer;">View all ></span>
                </div>
                
                <div style="position:relative; margin-bottom: 20px;">
                    <i class="fa-solid fa-magnifying-glass" style="position:absolute; left:15px; top:14px; color:var(--text-secondary);"></i>
                    <input type="text" id="explore-search-input" class="nexus-input" style="padding-left: 45px; border-radius: 50px; background: var(--bg-input); margin-bottom:0;" placeholder="Find Video Editor, Coder..." oninput="handleExploreSearch(this.value)">
                </div>

                <div id="explore-user-list">
                    <div class="loader-spinner" style="margin: 20px auto;"></div>
                </div>
            </div>
        </main>

        <!-- PROFILE SECTION -->
        <main id="section-profile" class="content-area hidden" style="padding-top: 0;">
            <div class="profile-header-wrapper">
                <img id="profile-banner" src="" class="banner-img" style="width:100%; height:150px; object-fit:cover; background:var(--bg-card);">
                <img id="profile-pic" src="" class="profile-pic-overlap" style="position:absolute; bottom:-50px; left:50%; transform:translateX(-50%); width:110px; height:110px; border-radius:50%; border:4px solid var(--bg-main); background:var(--bg-main); z-index:2; object-fit:cover;">
            </div>

            <div style="text-align: center; padding: 60px 20px 20px 20px;">
                <h2 id="profile-name">User</h2>
                <p id="profile-niche" class="mono" style="color: var(--accent); font-size: 0.95rem; margin-bottom: 5px; font-weight:bold;"></p>
                <p id="profile-location" style="color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 15px;"><i class="fa-solid fa-location-dot"></i> </p>
                
                <div id="profile-bio" class="bio-text"></div>
                
                <div class="stats-row" style="margin-top:20px;">
                    <div class="stat-box"><h3 id="stat-followers" style="color:var(--accent)">0</h3><span class="mono" style="font-size:0.7rem">FOLLOWERS</span></div>
                    <div class="stat-box"><h3 id="stat-following" style="color:var(--text-primary)">0</h3><span class="mono" style="font-size:0.7rem">FOLLOWING</span></div>
                </div>

                <div class="h-flex" style="justify-content: center; gap: 10px; margin-bottom: 20px;">
                    <button class="secondary-btn" onclick="editProfile()">Edit Profile</button>
                    <button class="secondary-btn" style="border-color: #ff5555; color: #ff5555;" onclick="firebase.auth().signOut()">Logout</button>
                </div>
            </div>
        </main>

        <!-- OTHER PROFILE SECTION -->
        <main id="section-other-profile" class="content-area hidden" style="padding-top: 0;">
            <div class="profile-header-wrapper">
                <img id="other-banner" src="" class="banner-img" style="width:100%; height:150px; object-fit:cover; background:var(--bg-card);">
                <div id="other-pic" class="profile-pic-overlap" style="position:absolute; bottom:-50px; left:50%; transform:translateX(-50%); width:110px; height:110px; border-radius:50%; border:4px solid var(--bg-main); background:var(--bg-main); z-index:2; background-size:cover; background-position:center;"></div>
            </div>
            <div style="text-align: center; padding: 60px 0 20px 0;">
                <h2 id="other-name">User</h2>
                <p id="other-niche" class="mono" style="color: var(--accent); font-size: 0.95rem; margin-bottom: 5px; font-weight:bold;"></p>
                <p id="other-location" style="color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 15px;"><i class="fa-solid fa-location-dot"></i> </p>
                
                <div id="other-bio" class="bio-text"></div>
                
                <div class="stats-row" style="margin-top:20px;">
                    <div class="stat-box"><h3 id="other-stat-followers" style="color:var(--accent)">0</h3><span class="mono" style="font-size:0.7rem">FOLLOWERS</span></div>
                    <div class="stat-box"><h3 id="other-stat-following" style="color:var(--text-primary)">0</h3><span class="mono" style="font-size:0.7rem">FOLLOWING</span></div>
                </div>

                <div class="h-flex" style="justify-content: center; gap: 10px; margin-bottom: 20px;">
                    <button id="btn-follow" class="action-btn" style="width:auto; margin-top:0;" onclick="toggleFollow()">Connect</button>
                    <button class="secondary-btn2" style="margin-top:0; width:auto;" onclick="startChat()">Message</button>
                </div>
            </div> 
        </main>

        <nav class="bottom-nav hidden" id="main-nav">
            <div class="nav-item active" onclick="switchTab('feed', this)"><i class="fa-solid fa-house"></i></div>
            <div class="nav-item" onclick="switchTab('explore', this)"><i class="fa-solid fa-map-location-dot"></i></div>
            <div class="nav-item" onclick="switchTab('chat-list', this)"><i class="fa-regular fa-comments"></i></div>
            <div class="nav-item" onclick="switchTab('profile', this)"><i class="fa-regular fa-user"></i></div>
        </nav>
    </div>

    <script>
        // --- CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyBg1m_bFN4xzl4yJ_JiG8E6UPDZjFks7PM",
            authDomain: "campus-point-rst.firebaseapp.com",
            projectId: "campus-point-rst",
            storageBucket: "campus-point-rst.firebasestorage.app",
            messagingSenderId: "877074516750",
            appId: "1:877074516750:web:f485c45a1446c030afa55f",
            measurementId: "G-M4WDE31CTL"
        };

        let db, auth, currentUser;
        let globalProfileData = {};
        let myLocation = null;
        let map; // Google Map instance
        let markers = []; // Store map markers

        function initApp() {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            auth = firebase.auth();

            auth.onAuthStateChanged(user => {
                const overlay = document.getElementById('auth-overlay');
                if (user) {
                    currentUser = user;
                    setTimeout(() => {
                        overlay.classList.add('hidden');
                        checkUserProfile(user);
                    }, 1000);
                } else {
                    overlay.classList.remove('hidden');
                    document.getElementById('auth-loader').style.display = 'none';
                    document.getElementById('google-btn').classList.remove('hidden');
                    document.getElementById('main-nav').classList.add('hidden');
                }
            });
        }

        function googleLogin() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(err => alert(err.message));
        }

        function checkUserProfile(user) {
            db.collection('users').doc(user.uid).onSnapshot(doc => {
                if (doc.exists) {
                    globalProfileData = doc.data();
                    if (document.getElementById('main-nav').classList.contains('hidden')) {
                        loadAppInterface(globalProfileData);
                    }
                } else {
                    document.getElementById('setup-name').value = user.displayName;
                    switchTab('setup', null);
                }
            });
        }

        function toggleEmpFields() {
            const status = document.getElementById('setup-emp-status').value;
            document.getElementById('fields-student').style.display = status === 'student' ? 'block' : 'none';
            document.getElementById('fields-professional').style.display = status === 'professional' ? 'block' : 'none';
        }

        function toggleIntentFields() {
            const intent = document.getElementById('setup-job-intent').value;
            document.getElementById('fields-job-prefs').style.display = (intent === 'yes' || intent === 'open') ? 'block' : 'none';
        }

        function editProfile() {
            document.getElementById('setup-name').value = globalProfileData.displayName || "";
            document.getElementById('setup-niche').value = globalProfileData.niche || "";
            
            if(globalProfileData.locationInfo) {
                document.getElementById('setup-country').value = globalProfileData.locationInfo.country || "";
                document.getElementById('setup-city').value = globalProfileData.locationInfo.city || "";
            }

            document.getElementById('setup-emp-status').value = globalProfileData.employmentStatus || 'student';
            toggleEmpFields();

            if (globalProfileData.employmentStatus === 'student' || !globalProfileData.employmentStatus) {
                document.getElementById('setup-university').value = globalProfileData.academic?.university || "";
                document.getElementById('setup-major').value = globalProfileData.academic?.major || "";
            } else {
                document.getElementById('setup-job-title').value = globalProfileData.jobInfo?.title || "";
                document.getElementById('setup-job-type').value = globalProfileData.jobInfo?.type || "Full-time";
                document.getElementById('setup-company').value = globalProfileData.jobInfo?.company || "";
            }

            document.getElementById('setup-job-intent').value = globalProfileData.jobIntent || "no";
            toggleIntentFields();

            if (globalProfileData.jobPrefs) {
                document.getElementById('setup-pref-titles').value = globalProfileData.jobPrefs.titles || "";
                document.getElementById('setup-pref-locations').value = globalProfileData.jobPrefs.locations || "";
            }

            document.getElementById('setup-bio').value = globalProfileData.bio || "";
            document.getElementById('setup-pic-preview').src = globalProfileData.photoURL || currentUser.photoURL;
            
            switchTab('setup', null);
        }

        async function completeSetup() {
            const name = document.getElementById('setup-name').value;
            const niche = document.getElementById('setup-niche').value;
            const country = document.getElementById('setup-country').value;
            const city = document.getElementById('setup-city').value;
            const empStatus = document.getElementById('setup-emp-status').value;
            const jobIntent = document.getElementById('setup-job-intent').value;
            
            if(!name) return alert("Name is required");

            const userData = {
                uid: currentUser.uid, 
                displayName: name, 
                photoURL: currentUser.photoURL, // Keep simple for snippet
                niche: niche,
                locationInfo: { country, city },
                employmentStatus: empStatus,
                jobIntent: jobIntent,
                bio: document.getElementById('setup-bio').value,
                lastActive: firebase.firestore.FieldValue.serverTimestamp()
            };

            if (empStatus === 'student') {
                userData.academic = {
                    university: document.getElementById('setup-university').value,
                    major: document.getElementById('setup-major').value
                };
            } else {
                userData.jobInfo = {
                    title: document.getElementById('setup-job-title').value,
                    type: document.getElementById('setup-job-type').value,
                    company: document.getElementById('setup-company').value
                };
            }

            if (jobIntent === 'yes' || jobIntent === 'open') {
                userData.jobPrefs = {
                    titles: document.getElementById('setup-pref-titles').value,
                    locations: document.getElementById('setup-pref-locations').value
                };
            }

            await db.collection('users').doc(currentUser.uid).set(userData, { merge: true });
            switchTab('profile');
        }

        function loadAppInterface(userData) {
            document.getElementById('profile-pic').src = userData.photoURL;
            document.getElementById('profile-name').innerText = userData.displayName;
            document.getElementById('profile-niche').innerText = userData.niche || "Professional";
            
            let locStr = "Location not set";
            if(userData.locationInfo && userData.locationInfo.city) locStr = `${userData.locationInfo.city}, ${userData.locationInfo.country}`;
            document.getElementById('profile-location').innerHTML = `<i class="fa-solid fa-location-dot"></i> ${locStr}`;
            
            document.getElementById('profile-bio').innerText = userData.bio || "";
            document.getElementById('main-nav').classList.remove('hidden');

            attemptGeoFetch(); // Get GPS for Explore Map
            switchTab('feed', document.querySelector('.nav-item'));
        }

        // --- GPS & MAPS ---
        function attemptGeoFetch() {
            if (!navigator.geolocation) return;
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    myLocation = { lat: position.coords.latitude, lng: position.coords.longitude };
                    db.collection('users').doc(currentUser.uid).update({
                        location: myLocation,
                        lastActive: firebase.firestore.FieldValue.serverTimestamp()
                    });
                },
                (error) => { console.warn("GPS Error", error); },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        function initMap() {
            const centerLoc = myLocation || { lat: 26.1445, lng: 91.7362 }; // Default (e.g., Guwahati)
            map = new google.maps.Map(document.getElementById("explore-map"), {
                zoom: 12,
                center: centerLoc,
                disableDefaultUI: true,
                styles: [
                    { elementType: "geometry", stylers: [{ color: "#242f3e" }] },
                    { elementType: "labels.text.stroke", stylers: [{ color: "#242f3e" }] },
                    { elementType: "labels.text.fill", stylers: [{ color: "#746855" }] },
                    { featureType: "water", elementType: "geometry", stylers: [{ color: "#17263c" }] }
                ]
            });
            loadExploreUsers(); // Load users when map is ready
        }

        let exploreSearchTimeout = null;
        function handleExploreSearch(query) {
            if (exploreSearchTimeout) clearTimeout(exploreSearchTimeout);
            exploreSearchTimeout = setTimeout(() => {
                loadExploreUsers(query.toLowerCase());
            }, 300);
        }

        function getDistanceFromLatLonInMeters(lat1, lon1, lat2, lon2) {
            var R = 6371e3; 
            var dLat = (lat2-lat1) * (Math.PI/180);  
            var dLon = (lon2-lon1) * (Math.PI/180); 
            var a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * (Math.PI/180)) * Math.cos(lat2 * (Math.PI/180)) * Math.sin(dLon/2) * Math.sin(dLon/2); 
            var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
            return R * c;
        }

        function loadExploreUsers(searchQuery = "") {
            const list = document.getElementById('explore-user-list');
            list.innerHTML = '<div class="loader-spinner" style="margin: 20px auto;"></div>';

            db.collection('users').limit(50).get().then(snap => {
                list.innerHTML = '';
                // Clear old map markers
                markers.forEach(m => m.setMap(null));
                markers = [];

                let usersWithDistance = [];

                snap.forEach(doc => {
                    const u = doc.data();
                    if(u.uid !== currentUser.uid) {
                        let dist = null;
                        if(myLocation && u.location) {
                            dist = getDistanceFromLatLonInMeters(myLocation.lat, myLocation.lng, u.location.lat, u.location.lng);
                        }
                        
                        // Filter by Search Query (Niche or Name)
                        let matchesSearch = true;
                        if (searchQuery) {
                            const nameMatch = u.displayName?.toLowerCase().includes(searchQuery);
                            const nicheMatch = u.niche?.toLowerCase().includes(searchQuery);
                            matchesSearch = nameMatch || nicheMatch;
                        }

                        if (matchesSearch) {
                            usersWithDistance.push({ ...u, distance: dist });
                        }
                    }
                });

                if(usersWithDistance.length === 0) {
                    list.innerHTML = '<p style="text-align:center; color:var(--text-secondary); margin-top:20px;">No professionals found.</p>';
                    return;
                }

                // Sort by distance (if available)
                usersWithDistance.sort((a, b) => (a.distance || 999999) - (b.distance || 999999));

                usersWithDistance.forEach(u => {
                    let distText = u.distance !== null ? `${(u.distance/1000).toFixed(1)} km away` : 'Location unknown';
                    
                    // Add to List
                    list.innerHTML += `
                        <div class="explore-user-card" onclick="openUserProfile('${u.uid}')">
                            <div class="avatar" style="background-image: url('${u.photoURL || ''}')"></div>
                            <div style="flex:1; margin-left: 12px;">
                                <div style="font-weight: 700; font-size: 1.05rem;">${u.displayName}</div>
                                <div style="font-size: 0.85rem; color: var(--accent); margin-bottom: 4px; font-family:'JetBrains Mono', monospace;">
                                    ${u.niche || 'Professional'}
                                </div>
                                <div style="font-size: 0.75rem; color: var(--text-secondary);">
                                    <i class="fa-solid fa-location-dot"></i> ${distText}
                                </div>
                            </div>
                            <div style="text-align: right;">
                                <i class="fa-regular fa-heart" style="color: var(--text-secondary); font-size: 1.2rem;"></i>
                            </div>
                        </div>
                    `;

                    // Add to Map
                    if (u.location && u.location.lat && map) {
                        const marker = new google.maps.Marker({
                            position: { lat: u.location.lat, lng: u.location.lng },
                            map: map,
                            title: u.displayName,
                            icon: {
                                url: u.photoURL,
                                scaledSize: new google.maps.Size(40, 40), 
                            }
                        });
                        
                        marker.addListener("click", () => {
                            openUserProfile(u.uid);
                        });
                        
                        markers.push(marker);
                    }
                });
            });
        }

        function openUserProfile(uid) {
            if (uid === currentUser.uid) {
                window.location.hash = 'profile';
                return;
            }
            
            db.collection('users').doc(uid).get().then(doc => {
                const u = doc.data();
                document.getElementById('other-pic').style.backgroundImage = `url('${u.photoURL}')`;
                document.getElementById('other-name').innerText = u.displayName;
                document.getElementById('other-niche').innerText = u.niche || "Professional";
                
                let locStr = "Location not set";
                if(u.locationInfo && u.locationInfo.city) locStr = `${u.locationInfo.city}, ${u.locationInfo.country}`;
                document.getElementById('other-location').innerHTML = `<i class="fa-solid fa-location-dot"></i> ${locStr}`;
                
                document.getElementById('other-bio').innerText = u.bio || "No bio.";
                window.location.hash = 'other-profile';
            });
        }

        // --- ROUTER ---
        window.currentHash = null;
        function router() {
            const newHash = window.location.hash.slice(1) || 'feed';
            window.currentHash = newHash;

            document.querySelectorAll('.content-area').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            const activeSection = document.getElementById('section-' + newHash);
            if (activeSection) {
                activeSection.classList.remove('hidden');
                const navBtn = document.querySelector(`.nav-item[onclick*="'${newHash}'"]`);
                if (navBtn) navBtn.classList.add('active');
            }

            if(newHash === 'explore' && !map) {
                // Initialize map if navigating to explore for the first time
                if (typeof google === 'object' && typeof google.maps === 'object') {
                    initMap();
                }
            }
        }

        function switchTab(id) {
            window.location.hash = id;
        }

        window.addEventListener('hashchange', router);
        window.addEventListener('load', () => {
            if(!window.location.hash) window.location.hash = 'feed';
            router();
        });

        initApp();
    </script>
</body>
</html>
